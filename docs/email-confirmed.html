<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Email confirmed | FoodLoop</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #213523;
        background: #f4f7f2;
      }

      .card {
        width: 100%;
        max-width: 440px;
        padding: 36px 28px;
        border: 1px solid #dce6d8;
        border-radius: 16px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #34733b;
        background: #dcefd9;
        font-size: 36px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      p {
        margin: 14px 0 0;
        color: #627064;
        line-height: 1.5;
      }

      .button {
        display: block;
        margin-top: 24px;
        padding: 14px 20px;
        border-radius: 10px;
        color: #ffffff;
        background: #34733b;
        font-weight: 700;
        text-decoration: none;
      }

      .button:focus-visible {
        outline: 3px solid #8fbd8c;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">&#10003;</div>
      <h1>Email verified</h1>
      <p>
        Your FoodLoop account has been confirmed. You can now return to
        FoodLoop and log in.
      </p>
    </main>
  </body>
</html>
